# Loaded when a test uses @ActiveProfiles("test"); layered on top of application.properties.

# Tests create their own data so assertions stay deterministic (seeding is tested separately)
app.seed.enabled=false

# A unique DB name per Spring context so cached test contexts never share or clobber each other's data
spring.datasource.url=jdbc:h2:mem:test-${random.uuid};DB_CLOSE_DELAY=-1