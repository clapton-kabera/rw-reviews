spring.application.name=rw-reviews

# ---- H2 in-memory database ----
# DB_CLOSE_DELAY=-1 keeps the DB alive for the whole JVM lifetime (not just while one connection is open).
# Being in-memory, the data is wiped on every restart, which is exactly why we re-seed on startup.
spring.datasource.url=jdbc:h2:mem:reviewsdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# ---- JPA ----
# create-drop: build the schema from the entities at startup and drop it at shutdown
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Disable "open session in view" so lazy loading never happens implicitly while rendering JSON.
# All entity -> DTO mapping happens inside @Transactional service methods instead.
spring.jpa.open-in-view=false

# Optional: browse the DB at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:reviewsdb)
spring.h2.console.enabled=true

# ---- Custom ----
# Set to false to start with an empty database
app.seed.enabled=true