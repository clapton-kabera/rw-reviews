name: CI

# Run on every commit pushed to any branch, and on every pull request
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven   # caches ~/.m2 so later runs are faster

      # Compiles, runs all unit/integration tests, and packages the jar.
      # The build fails (and the commit shows a red X) if any test fails.
      - name: Build and run tests
        working-directory: ./rw-reviews
        run: mvn -B verify

      # Start the packaged jar and call it, to prove the app really boots and serves data
      - name: Smoke test the packaged app
        working-directory: ./rw-reviews
        run: |
          java -jar target/rw-reviews-0.0.1-SNAPSHOT.jar &
          APP_PID=$!
          # Wait up to ~60s for the server to come up
          for i in $(seq 1 30); do
            curl -sf "http://localhost:8080/api/businesses?size=1" > /dev/null && break
            sleep 2
          done
          # These fail the step if the app is down or the seeded data is missing
          curl -sf "http://localhost:8080/api/businesses?size=1" | grep -q '"content"'
          curl -sf "http://localhost:8080/api/businesses/1/reviews?size=5" | grep -q '"totalElements"'
          kill $APP_PID

      # Keep test reports for debugging when something fails
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

